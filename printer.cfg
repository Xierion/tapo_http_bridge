[idle_timeout]
timeout: 300            # steppers disable after 5 min idle
gcode:
    TURN_OFF_HEATERS
    M84
    UPDATE_DELAYED_GCODE ID=delayed_poweroff DURATION=600   ; start 10-min countdown

[delayed_gcode delayed_poweroff]
initial_duration: 0
gcode:
    {% if printer.heater_bed.temperature < 40 %}
        {action_call_remote_method("set_device_power",
                                    device="tapo_plug",
                                    state="off")}
    {% else %}
        {action_respond_info("Bed still warm (%.1f°C), delaying power-off" %
                              printer.heater_bed.temperature)}
        UPDATE_DELAYED_GCODE ID=delayed_poweroff DURATION=60
    {% endif %}
