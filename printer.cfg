[idle_timeout]
timeout: 300 # steppers disable after 5 min idle
gcode:
    {action_respond_info("idle_timeout triggered")}
    TURN_OFF_HEATERS
    M84
    UPDATE_DELAYED_GCODE ID=delayed_poweroff DURATION=5 ; start temp check

[delayed_gcode delayed_poweroff]
initial_duration: 0
gcode:
    {% if printer.extruder.temperature < 50 %}
        {action_call_remote_method("set_device_power",
                                    device="tapo_plug",
                                    state="off")}
    {% else %}
        {action_respond_info("Hotend still warm (%.1f°C), delaying power-off" %
                              printer.extruder.temperature)}
        UPDATE_DELAYED_GCODE ID=delayed_poweroff DURATION=60 ; poll every 60 seconds
    {% endif %}
